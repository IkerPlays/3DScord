name: Build 3DSX + CIA

# Pushes and pull requests are only BUILT (artifacts, never a release).
# A devbuild pre-release is published ONLY when this workflow is run by hand
# (Actions > Build 3DSX + CIA > Run workflow, on main), after a complete update.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build (empty: the latest commit of main)"
        required: false
        type: string

permissions:
  contents: write # needed to publish devbuild releases

# Pushes and manual (devbuild) runs queue separately: a push can never cancel a devbuild that was asked for by hand,
# and a newer push replaces an older push build that is still running.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  # Devbuilds are numbered after the next stable version: with 0.2.0 out they are 0.3.0-dev.1, 0.3.0-dev.2 ...
  # The number counts the devbuilds that exist for that version, so it has no gaps, and every devbuild is newer than the
  # stable release before it and older than the stable release it leads to.
  version:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.ver.outputs.core }}
      dev: ${{ steps.ver.outputs.dev }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 100 \
                     --json tagName --jq '.[].tagName' | sed 's/^v//' \
                     | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          IFS=. read -r a b c <<< "${stable:-0.0.0}"
          core="$a.$((b + 1)).0"
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' \
                   | sed -n "s/^v${core//./\\.}-dev\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -1 || true)
          dev=$(( ${last:-0} + 1 ))
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "version=${core}-dev.${dev}" >> "$GITHUB_OUTPUT"
          echo "Stable: ${stable:-none}  ->  this build: ${core}-dev.${dev}"

  build:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: System tools
        run: |
          apt-get update
          apt-get install -y git make cmake g++ gcc

      - name: Build makerom and bannertool
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps
          make -C /tmp/ctr/makerom -j"$(nproc)"
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cmake -S /tmp/bannertool -B /tmp/bannertool/b
          make -C /tmp/bannertool/b -j"$(nproc)"
          cp /tmp/bannertool/b/bannertool /usr/local/bin/

      - name: Set devbuild version
        env:
          CORE: ${{ needs.version.outputs.core }}
        run: |
          IFS=. read -r a b c <<< "$CORE"
          sed -i -e "s/^APP_VERSION_MAJOR.*/APP_VERSION_MAJOR = $a/" \
                 -e "s/^APP_VERSION_MINOR.*/APP_VERSION_MINOR = $b/" \
                 -e "s/^APP_VERSION_MICRO.*/APP_VERSION_MICRO = $c/" resources/AppInfo

      - name: Build .3dsx and .cia
        run: make -j"$(nproc)" MAKEROM=makerom BANNERTOOL=bannertool APP_DEV_BUILD=${{ needs.version.outputs.dev }}

      - name: Collect files
        run: |
          mkdir dist
          cp 3DScord.cia dist/3DScord.cia
          cp 3DScord.3dsx dist/3DScord.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: 3DScord
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: 3DScord-elf
          path: 3DScord.elf
          retention-days: 7

  release:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: 3DScord
          path: dist

      # Notes: the "Unreleased" section of CHANGELOG.md of the built commit (written by hand, shown in the app before
      # updating), or, when it is empty, the commit subjects since the previous release.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git fetch --tags --force
          built=$(git rev-parse HEAD)
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          changes=$(awk '/^## /{f=($0=="## Unreleased"); next} f' CHANGELOG.md | sed '/./,$!d' | cat -s)
          if [ -z "$changes" ]; then
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then range="$prev..HEAD"; else range="-30"; fi
            changes=$(git log --no-merges --pretty='- %s' $range | grep -v -i -E '^- (Bump |Import |Merge )' | head -40 || true)
          fi
          {
            echo "# 3DScord ${VERSION} (devbuild)"
            echo
            printf '%s\n' "$changes"
            echo
            echo "---"
            echo "Development build of commit \`${built::7}\`. Install \`3DScord.cia\` with FBI, or run \`3DScord.3dsx\` from the Homebrew Launcher. It may be unstable."
          } > notes.md
          cat notes.md

      # The tag is made on the current tip of main: with the default token GitHub refuses to tag any commit whose
      # .github/workflows files differ from the ones on the branch ("Resource not accessible by integration").
      # The files attached are built from the requested commit, and the notes say which one.
      - name: Publish devbuild
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/3DScord.cia dist/3DScord.3dsx \
            --repo "$GITHUB_REPOSITORY" --target main --prerelease \
            --title "3DScord ${VERSION} (devbuild)" \
            --notes-file notes.md
