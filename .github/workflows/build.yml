name: Build 3DSX + CIA

# Pushes and pull requests are only BUILT (artifacts, never a release).
# A devbuild pre-release is published ONLY when this workflow is run by hand
# (Actions > Build 3DSX + CIA > Run workflow, on main), after a complete update.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish devbuild releases

# Pushes and manual (devbuild) runs queue separately: a push can never cancel a devbuild that was asked for by hand,
# and a newer push replaces an older push build that is still running.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  # Version of this build: "<core>-dev.<run number>". <core> is the version of resources/AppInfo, but never lower
  # than the latest stable release + 1 patch, so a devbuild is always newer than the stable one it follows.
  version:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.ver.outputs.core }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          get() { sed -n "s/^$1 *= *\([0-9]*\).*/\1/p" resources/AppInfo; }
          core="$(get APP_VERSION_MAJOR).$(get APP_VERSION_MINOR).$(get APP_VERSION_MICRO)"
          stable=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 100 \
                     --json tagName --jq '.[].tagName' | sed 's/^v//' \
                     | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$stable" ] && [ "$(printf '%s\n%s\n' "$core" "$stable" | sort -V | tail -1)" = "$stable" ]; then
            IFS=. read -r a b c <<< "$stable"
            core="$a.$b.$((c + 1))"
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "version=${core}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: System tools
        run: |
          apt-get update
          apt-get install -y git make cmake g++ gcc

      - name: Build makerom and bannertool
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps
          make -C /tmp/ctr/makerom -j"$(nproc)"
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cmake -S /tmp/bannertool -B /tmp/bannertool/b
          make -C /tmp/bannertool/b -j"$(nproc)"
          cp /tmp/bannertool/b/bannertool /usr/local/bin/

      - name: Set devbuild version
        env:
          CORE: ${{ needs.version.outputs.core }}
        run: |
          IFS=. read -r a b c <<< "$CORE"
          sed -i -e "s/^APP_VERSION_MAJOR.*/APP_VERSION_MAJOR = $a/" \
                 -e "s/^APP_VERSION_MINOR.*/APP_VERSION_MINOR = $b/" \
                 -e "s/^APP_VERSION_MICRO.*/APP_VERSION_MICRO = $c/" resources/AppInfo

      - name: Build .3dsx and .cia
        run: make -j"$(nproc)" MAKEROM=makerom BANNERTOOL=bannertool APP_DEV_BUILD=${{ github.run_number }}

      - name: Collect files
        run: |
          mkdir dist
          cp 3DScord.cia dist/3DScord.cia
          cp 3DScord.3dsx dist/3DScord.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: 3DScord
          path: dist/

  release:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: 3DScord
          path: dist

      # Notes: the "Unreleased" section of CHANGELOG.md (written by hand, shown in the app before updating),
      # or, when it is empty, the commit subjects since the previous release.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git fetch --tags --force
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          awk '/^## /{f=($0=="## Unreleased"); next} f' CHANGELOG.md | sed '/./,$!d' > changes.md
          if [ ! -s changes.md ]; then
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then range="$prev..HEAD"; else range="-30"; fi
            git log --no-merges --pretty='- %s' $range | grep -v -i -E '^- (Bump |Import |Merge )' | head -40 > changes.md || true
          fi
          {
            echo "# 3DScord ${VERSION} (devbuild)"
            echo
            cat changes.md
            echo
            echo "---"
            echo "Development build from commit \`${GITHUB_SHA::7}\`. Install \`3DScord.cia\` with FBI, or run \`3DScord.3dsx\` from the Homebrew Launcher. May be unstable."
          } > notes.md
          cat notes.md

      - name: Publish devbuild
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/3DScord.cia dist/3DScord.3dsx \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "3DScord ${VERSION} (devbuild)" \
            --notes-file notes.md
