name: Build 3DSX + CIA

# Every push to main and every pull request is built (artifacts only).
# Run by hand (Actions > Build 3DSX + CIA > Run workflow, on main) to also publish a devbuild pre-release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish devbuild releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: System tools
        run: |
          apt-get update
          apt-get install -y git make cmake g++ gcc

      - name: Build makerom and bannertool
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps
          make -C /tmp/ctr/makerom -j"$(nproc)"
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cmake -S /tmp/bannertool -B /tmp/bannertool/b
          make -C /tmp/bannertool/b -j"$(nproc)"
          cp /tmp/bannertool/b/bannertool /usr/local/bin/

      - name: Build .3dsx and .cia
        run: make -j"$(nproc)" MAKEROM=makerom BANNERTOOL=bannertool

      - name: Collect files
        id: ver
        run: |
          get() { sed -n "s/^$1 *= *\([0-9]*\).*/\1/p" resources/AppInfo; }
          echo "version=$(get APP_VERSION_MAJOR).$(get APP_VERSION_MINOR).$(get APP_VERSION_MICRO)-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp TriCord.cia TriCord.3dsx dist/

      - uses: actions/upload-artifact@v4
        with:
          name: 3DScord
          path: dist/

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: 3DScord
          path: dist
      - name: Publish devbuild
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/TriCord.cia dist/TriCord.3dsx \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "3DScord ${VERSION} (devbuild)" \
            --notes "Development build ${VERSION} from commit \`${GITHUB_SHA::7}\`. Install \`TriCord.cia\` with FBI, or run \`TriCord.3dsx\` from the Homebrew Launcher. May be unstable."
