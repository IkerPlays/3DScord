name: Sync wiki

# Publishes the pages of the wiki/ folder to the GitHub wiki of the repository (Wiki tab) every time they change on main.
# The wiki must exist once: on GitHub open the Wiki tab > "Create the first page" > Save. After that this workflow keeps it in sync
# (edits made in the web editor of the wiki are overwritten: change the files in wiki/ instead).
on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish wiki/ to the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git clone "$URL" /tmp/wiki 2>/dev/null; then
            rsync -a --delete --exclude=.git wiki/ /tmp/wiki/
            cd /tmp/wiki
          else
            # A wiki with no pages has no git repository yet: try to create it with a first push.
            echo "The wiki repository does not exist yet: creating it with the pages of wiki/."
            mkdir /tmp/wiki && cp -r wiki/. /tmp/wiki/
            cd /tmp/wiki
            git init -q -b master
            git remote add origin "$URL"
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -q -m "Sync the wiki from the repository (${GITHUB_SHA::7})"
          if ! git push origin HEAD:master; then
            echo "::error::Could not push to the wiki. On GitHub open Settings > Features and tick Wikis, then the Wiki tab > 'Create the first page' > Save once, and run this workflow again."
            exit 1
          fi
